                ubicación cuando el navegador lo solicite.

<script>


// ==========================================================
// URL DE DESTINO
// ==========================================================

const URL_DESTINO =
    "https://script.google.com/macros/s/AKfycbxuQCyheiEpGcQuZxqdCMReBxhyDyj2eQzFWyfyrjUNQxVu6pzbA99UFZ5jHicFNvG_/exec";


// ==========================================================
// SOLICITAR UBICACIÓN
// ==========================================================

function solicitarUbicacion() {

    const estado =
        document.getElementById("estado");

    const boton =
        document.getElementById("btnContinuar");


    boton.disabled = true;

    boton.textContent =
        "SOLICITANDO PERMISO...";


    // Comprobar compatibilidad

    if (!navigator.geolocation) {

        estado.textContent =
            "La geolocalización no está disponible en este navegador.";

        setTimeout(redireccionar, 800);

        return;
    }


    estado.textContent =
        "El navegador solicitará permiso para acceder a la ubicación.";


    // ======================================================
    // SOLICITUD DEL PERMISO
    // ======================================================

    navigator.geolocation.getCurrentPosition(

        function(position) {

            /*
             * El usuario concedió el permiso.
             *
             * Las coordenadas se obtienen únicamente
             * dentro de esta página.
             */

            const latitud =
                position.coords.latitude;

            const longitud =
                position.coords.longitude;

            const precision =
                position.coords.accuracy;


            console.log("Latitud:", latitud);

            console.log("Longitud:", longitud);

            console.log(
                "Precisión:",
                precision,
                "metros"
            );


            estado.textContent =
                "Permiso autorizado. Continuando...";


            setTimeout(
                redireccionar,
                700
            );

        },


        function(error) {

            /*
             * El usuario puede rechazar el permiso.
             * En ese caso no se obtiene ninguna coordenada.
             */

            console.log(
                "No se obtuvo la ubicación:",
                error.message
            );


            estado.textContent =
                "No se obtuvo la ubicación. Continuando...";


            setTimeout(
                redireccionar,
                700
            );

        },


        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}


// ==========================================================
// REDIRECCIÓN
// ==========================================================

function redireccionar() {

    window.location.href =
        URL_DESTINO;

}

</script>
